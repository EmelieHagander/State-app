<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>STATE.md Viewer (fallback)</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1a1a1a;
        --muted: #6b7280;
        --border: #e5e7eb;
        --bg: #ffffff;
        --amber: #b45309;
        --red: #dc2626;
        --green: #059669;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #f4f4f5;
          --muted: #9ca3af;
          --border: #2a2a2a;
          --bg: #161616;
          --amber: #f59e0b;
          --red: #f87171;
          --green: #34d399;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      .wrap { max-width: 760px; margin: 0 auto; padding: 32px 24px; }
      h1 { font-size: 1.6rem; margin: 0 0 4px; }
      h2 {
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin: 28px 0 6px;
      }
      .meta-top { color: var(--muted); font-size: 0.85rem; margin-bottom: 4px; }
      .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; }
      .item { display: flex; gap: 8px; margin-top: 10px; }
      .item.sub { margin-left: 26px; }
      .icon { width: 16px; text-align: center; flex: none; line-height: 1.4; }
      .ord { font: 12px/1.4 ui-monospace, monospace; color: var(--muted); margin-right: 6px; }
      .title { font-weight: 600; }
      .badge {
        display: inline-block;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 1px 8px;
        font-size: 0.72rem;
        margin-left: 8px;
        vertical-align: middle;
      }
      .pr { color: var(--muted); }
      .body { font-size: 0.9rem; color: var(--muted); margin: 2px 0 0; white-space: pre-line; }
      .where { white-space: pre-line; color: var(--muted); font-size: 0.9rem; }
      ul.plain { margin: 6px 0 0; padding-left: 20px; color: var(--muted); font-size: 0.9rem; }
      .done { color: var(--green); }
      .in-progress { color: var(--amber); }
      .blocked { color: var(--red); }
      .pending, .parked { color: var(--muted); }
      .warn {
        margin: 16px 0;
        border: 1px solid color-mix(in srgb, var(--amber) 40%, transparent);
        border-radius: 8px;
        padding: 10px 12px;
        color: var(--amber);
        font-size: 0.85rem;
      }
      .warn ul { margin: 6px 0 0; padding-left: 18px; }
      .warn li { font: 12px/1.5 ui-monospace, monospace; word-break: break-all; }
      button, label.file {
        font: inherit;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
        padding: 6px 12px;
        border-radius: 8px;
        cursor: pointer;
      }
      textarea {
        width: 100%;
        min-height: 180px;
        font: 13px/1.5 ui-monospace, monospace;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: transparent;
        color: var(--fg);
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="toolbar">
        <strong>STATE.md Viewer</strong>
        <span class="meta-top">— standalone fallback, mirrors STATE-FORMAT.md / the app parser</span>
        <label class="file" style="margin-left:auto">
          Open STATE.md
          <input id="file" type="file" accept=".md,text/markdown" hidden />
        </label>
      </div>
      <details>
        <summary class="meta-top">Or paste markdown</summary>
        <textarea id="paste" placeholder="Paste STATE.md content, then click Render"></textarea>
        <button id="render" style="margin-top:8px">Render</button>
      </details>
      <div id="out"></div>
    </div>

    <script>
      // Mirrors src/lib/parse-state.ts — keep in sync with STATE-FORMAT.md.
      const STATUSES = new Set([
        "pending",
        "in-progress",
        "done",
        "blocked",
        "parked",
      ]);
      const SEP = " · ";
      const ORDINAL_RE = /^(\d+(?:\.\d+)*)\.?\s+(.*)$/;
      const PR_RE = /^PR #(\d+)\s+"([^"]*)"$/;

      function asStatus(raw) {
        return STATUSES.has(raw) ? raw : null;
      }

      function parseStepLine(text) {
        const m = ORDINAL_RE.exec(text);
        if (m === null) return null;
        const ordinal = m[1] || "";
        const rest = (m[2] || "").trim();
        if (!ordinal || !rest) return null;
        const parts = rest.split(SEP);
        if (parts.length < 2) return null;
        const title = (parts[0] || "").trim();
        const status = asStatus((parts[1] || "").trim());
        if (!title || status === null) return null;
        let pr = null;
        if (parts.length >= 3) {
          const pm = PR_RE.exec(parts.slice(2).join(SEP).trim());
          if (pm !== null) pr = { number: Number(pm[1]), name: pm[2] || "" };
        }
        const segments = ordinal.split(".").map((s) => Number(s));
        return {
          ordinal,
          segments,
          depth: segments.length,
          title,
          status,
          pr,
          body: "",
          children: [],
        };
      }

      function parseState(md) {
        const lines = md.split(/\r?\n/);
        const r = {
          title: "",
          lastUpdated: "",
          currentFocus: "",
          where: "",
          steps: [],
          flat: [],
          questions: [],
          skipped: [],
        };
        let section = "none";
        const whereLines = [];
        const stack = [];
        let lastStep = null;

        for (const raw of lines) {
          const t = raw.trim();
          if (t.startsWith("# ") && !r.title) {
            r.title = t.slice(2).trim();
            continue;
          }
          const lu = /^_Last updated:\s*(.+?)_$/.exec(t);
          if (lu !== null && !r.lastUpdated) {
            r.lastUpdated = (lu[1] || "").trim();
            continue;
          }
          if (t.startsWith("## ")) {
            const h = t.slice(3).trim().toLowerCase();
            lastStep = null;
            section = h.includes("where we are")
              ? "where"
              : h.includes("path")
                ? "path"
                : h.includes("open questions")
                  ? "questions"
                  : "none";
            continue;
          }
          if (section === "where") {
            const f = /^\*\*Current focus:\*\*\s*(.+)$/.exec(t);
            if (f !== null) {
              r.currentFocus = (f[1] || "").trim();
              continue;
            }
            if (t) whereLines.push(t);
            continue;
          }
          if (section === "path") {
            const step = parseStepLine(t);
            if (step !== null) {
              while (
                stack.length > 0 &&
                (stack[stack.length - 1]?.depth ?? 0) >= step.depth
              ) {
                stack.pop();
              }
              if (step.depth === 1) {
                r.steps.push(step);
                r.flat.push(step);
                stack.push(step);
                lastStep = step;
              } else {
                const parent = stack[stack.length - 1];
                if (parent !== undefined && parent.depth === step.depth - 1) {
                  parent.children.push(step);
                  r.flat.push(step);
                  stack.push(step);
                  lastStep = step;
                } else {
                  r.skipped.push({ text: t, reason: "orphan" });
                  lastStep = null;
                }
              }
              continue;
            }
            if (ORDINAL_RE.test(t)) {
              r.skipped.push({ text: t, reason: "malformed" });
              continue;
            }
            if (t && lastStep !== null) {
              lastStep.body = lastStep.body ? lastStep.body + "\n" + t : t;
            }
            continue;
          }
          if (section === "questions" && t.startsWith("- ")) {
            r.questions.push(t.slice(2).trim());
          }
        }
        r.where = whereLines.join("\n").trim();
        return r;
      }

      const ICON = {
        done: "✔",
        "in-progress": "⟳",
        pending: "○",
        blocked: "⛔",
        parked: "☾",
      };
      const esc = (s) =>
        String(s).replace(
          /[&<>]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c],
        );

      function renderStep(it) {
        let h = `<div class="item ${it.depth > 1 ? "sub " : ""}${it.status}">`;
        h += `<div class="icon">${ICON[it.status]}</div><div>`;
        h += `<span class="ord">${esc(it.ordinal)}</span>`;
        h += `<span class="title">${esc(it.title)}</span>`;
        h += `<span class="badge">${it.status}</span>`;
        if (it.pr)
          h += `<span class="badge pr">PR #${it.pr.number} ${esc(it.pr.name)}</span>`;
        if (it.body) h += `<p class="body">${esc(it.body)}</p>`;
        h += `</div></div>`;
        for (const c of it.children) h += renderStep(c);
        return h;
      }

      function render(md) {
        const s = parseState(md);
        let h = `<h1>${esc(s.title || "Untitled project")}</h1>`;
        if (s.lastUpdated)
          h += `<div class="meta-top">Last updated: ${esc(s.lastUpdated)}</div>`;
        h += `<h2>Where we are</h2>`;
        if (s.currentFocus)
          h += `<p><strong>Current focus:</strong> ${esc(s.currentFocus)}</p>`;
        if (s.where) h += `<p class="where">${esc(s.where)}</p>`;
        if (s.skipped.length) {
          h += `<div class="warn"><strong>${s.skipped.length} step-like line(s) dropped (not shown)</strong> — fix against STATE-FORMAT.md:<ul>`;
          for (const sk of s.skipped)
            h += `<li>[${sk.reason}] ${esc(sk.text)}</li>`;
          h += `</ul></div>`;
        }
        h += `<h2>Path</h2>`;
        if (!s.steps.length) h += `<p class="body">No steps.</p>`;
        for (const it of s.steps) h += renderStep(it);
        if (s.questions.length) {
          h += `<h2>Open questions</h2><ul class="plain">`;
          for (const q of s.questions) h += `<li>${esc(q)}</li>`;
          h += `</ul>`;
        }
        document.getElementById("out").innerHTML = h;
      }

      document.getElementById("file").addEventListener("change", (e) => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        const rd = new FileReader();
        rd.onload = () => render(String(rd.result));
        rd.readAsText(f);
      });
      document.getElementById("render").addEventListener("click", () => {
        render(document.getElementById("paste").value);
      });
    </script>
  </body>
</html>
